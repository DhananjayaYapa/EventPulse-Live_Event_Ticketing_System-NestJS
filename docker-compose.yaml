services:
  auth:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
      target: development
    command: pnpm run dev:auth
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./apps/auth/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auth?schema=public
    ports:
      - '3001:3001'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  postgres:
    image: postgres:16-alpine
    container_name: eventpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d auth']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
